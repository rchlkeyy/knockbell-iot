<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>KnockBell Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/mqtt@5.10.1/dist/mqtt.min.js"></script>
<style>
body{font-family:system-ui,sans-serif;margin:0;padding:16px;background:#f5f5f2;color:#1b1b1b;max-width:760px;margin:auto}
.card{background:#fff;border:1px solid #ddd;border-radius:10px;padding:12px 14px;margin:10px 0}
h1{font-size:20px}h2{font-size:12px;color:#666;text-transform:uppercase;margin:0 0 8px}
input{padding:6px;border:1px solid #bbb;border-radius:6px}button{padding:7px 12px;border:1px solid #888;border-radius:6px;background:#fff;cursor:pointer;margin:2px}
button.on{background:#1b4f8a;color:#fff}.big{font-size:28px;font-weight:700}
.KNOCK{color:#b45309}.DOOR_MOVE{color:#1d4ed8}.DOOR_SLAM,.INTRUSION_ALERT{color:#b91c1c}.IDLE{color:#15803d}
#log{max-height:220px;overflow:auto;font:13px/1.5 ui-monospace,monospace}canvas{width:100%;height:120px}
</style></head><body>
<h1>KnockBell Dashboard <small id="conn">(terputus)</small></h1>
<div class="card"><h2>Koneksi (MQTT over WebSocket TLS)</h2>
 <input id="pid" size="26" value="kelas_iot_kelompok_XX"> <input id="url" size="34" value="wss://broker.hivemq.com:8884/mqtt">
 <button onclick="connect()">Hubungkan</button></div>
<div class="card"><h2>Status pintu (Edge 1)</h2><div id="label" class="big IDLE">-</div>
 <div>Mode: <b id="mode">HOME</b> | HP pemilik: <b id="owner">-</b></div>
 <button id="bh" onclick="setMode('HOME')">Mode HOME</button><button id="ba" onclick="setMode('AWAY')">Mode AWAY (jaga pintu)</button></div>
<div class="card"><h2>Balas tamu (dibacakan HP di pintu)</h2>
 <button onclick="reply('Sebentar ya, penghuni sedang menuju pintu.')">Sebentar ya</button>
 <button onclick="reply('Silakan taruh paket di depan pintu, terima kasih.')">Taruh paket</button>
 <button onclick="reply('Penghuni sedang tidak di tempat.')">Tidak di tempat</button></div>
<div class="card"><h2>Getaran pintu (hf_rms) - 60 pesan terakhir</h2><canvas id="cv" width="700" height="120"></canvas></div>
<div class="card"><h2>Log kejadian</h2><div id="log"></div></div>
<script>
let c, P, hist=[];
const T=(...p)=>["knockbell",P,...p].join("/");
function connect(){
  P=document.getElementById("pid").value.trim();
  if(c) c.end(true);
  c=mqtt.connect(document.getElementById("url").value);
  c.on("connect",()=>{document.getElementById("conn").textContent="(terhubung)";
    c.subscribe([T("state"),T("events"),T("edge","edge1","telemetry")])});
  c.on("close",()=>document.getElementById("conn").textContent="(terputus)");
  c.on("message",(t,m)=>{let d;try{d=JSON.parse(m.toString())}catch(e){return}
    if(t===T("state")){const l=document.getElementById("label");l.textContent=d.label;l.className="big "+d.label;
      document.getElementById("mode").textContent=d.mode;document.getElementById("owner").textContent=d.owner_active?"diangkat":"diam";
      document.getElementById("bh").className=d.mode==="HOME"?"on":"";document.getElementById("ba").className=d.mode==="AWAY"?"on":""}
    else if(t===T("events")){const e=document.createElement("div");e.className=d.type;
      e.textContent=new Date(d.ts).toLocaleTimeString()+"  "+d.type+": "+d.message;
      const lg=document.getElementById("log");lg.prepend(e)}
    else{hist.push(d.features.hf_rms);hist=hist.slice(-60);draw()}});
}
function pub(t,o){if(c)c.publish(t,JSON.stringify(o),{qos:1})}
const setMode=m=>pub(T("control"),{action:"set_mode",mode:m});
function addLog(txt,cls){const e=document.createElement("div");e.className=cls||"";e.textContent=new Date().toLocaleTimeString()+"  "+txt;document.getElementById("log").prepend(e)}
const reply=x=>{if(!c||!c.connected){addLog("Belum terhubung ke broker, klik Hubungkan dulu","INTRUSION_ALERT");return}
  pub(T("commands"),{target:"edge1",action:"speak",text:x});addLog("Balasan dikirim ke HP pintu: "+x,"")};
function draw(){const cv=document.getElementById("cv"),g=cv.getContext("2d");g.clearRect(0,0,700,120);
  g.strokeStyle="#1b4f8a";g.beginPath();hist.forEach((v,i)=>{const x=i*700/59,y=115-Math.min(v,5)*22;i?g.lineTo(x,y):g.moveTo(x,y)});g.stroke()}
</script></body></html>
